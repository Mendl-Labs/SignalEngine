[workspace]
members = [
    "program", 
    "hostbuilder", 
    "datahandler", 
    "portfoliohandler", 
    "signalgenerator", 
    "config", 
    "orderbook", 
    "portfolio", 
    "executionhandler", 
    "smartorderrouter", 
    "exchangemetricaggregator",
    "strategyhandler",
    "signal",
    "signaldispatcher",
]
resolver = "2"

[package]
name = "signalengine"
version = "0.1.0"
edition = "2021"

[lib]
name = "signalengine"
path = "src/lib.rs"

[dependencies]
ultra-logger = { workspace = true }
tokio = { version = "1.45", features = ["full"] }
serde = { workspace = true }
serde_json = "1.0"

[workspace.dependencies]
# Ultra-low latency logging engine
ultra-logger = { path = "../LoggingEngine/ultra-logger" }
log-aggregator = { path = "../LoggingEngine/log-aggregator" }
metrics-collector = { path = "../LoggingEngine/metrics-collector" }

# Ultra-Fast Production Optimizations
crossbeam = "0.8"
dashmap = "5.0"
bytes = "1.0"
bincode = "1.3"
socket2 = "0.5"
futures = "0.3"
fastrand = "2.0"
serde = { version = "1.0", features = ["derive"] }
atomic = "0.6"

[profile.release-ultra]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "fat"
debug = false
overflow-checks = false
