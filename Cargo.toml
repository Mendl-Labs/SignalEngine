[workspace]
members = [
    "program",
    "crates/core",
    "crates/hostbuilder",
    "crates/datahandler",
    "crates/portfoliohandler",
    "crates/signalgenerator",
    "crates/config",
    "crates/orderbook",
    "crates/portfolio",
    "crates/executionhandler",
    "crates/smartorderrouter",
    "crates/exchangemetricaggregator",
    "crates/strategyhandler",
    "crates/strategyloader",
    "crates/signal",
    "crates/signaldispatcher",
    "crates/pythonbridge-worker",
    "crates/broker-adapters",
    "crates/fake-broker",
    "crates/mandate-core",
    "crates/rebalancer-core",
    "crates/rebalancer-risk",
    "crates/rebalancer-run",
    "crates/rebalancer-store",
    "crates/rebalancer-service",
    "crates/portfolio-parity",
]
resolver = "2"

[workspace.dependencies]
# Ultra-low latency logging engine
ultra-logger = { path = "../LoggingEngine/ultra-logger" }

# The decision rules (ETF trend, crypto trend, FX momentum) live in the public BacktestingCore repository: ONE
# implementation shared with the backtester, so the rebalancer and the backtest agree by construction
# (product-mandate/BACKTESTER_TRUTH_DESIGN.md, stage T2). The crate moved there with its public API unchanged.
#
# TODO(T2, owner): replace the placeholder rev with the merged BacktestingCore commit, or with `tag = "vX.Y.Z"` once
# the release tag exists. Until then this line is a PLACEHOLDER: the workspace does not resolve and CI cannot build.
# Local verification used a temporary path override that was NOT committed.
reference-rules = { git = "https://github.com/Mendl-Labs/BacktestingCore", rev = "f1a65a168f9089edf6e7a963226cafc54c98a91e" }

# Internal workspace crates
smartorderrouter = { path = "crates/smartorderrouter" }
databaseschema = { path = "../databaseschema" }

# Ultra-Fast Production Optimizations
crossbeam = "0.8"
dashmap = "5.0"
bytes = "1.0"
bincode = "1.3"
socket2 = "0.5"
futures = "0.3"
fastrand = "2.0"
serde = { version = "1.0", features = ["derive"] }
atomic = "0.6"

[profile.release-ultra]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "fat"
debug = false
overflow-checks = false

# BacktestingCore's dataloader (used by hostbuilder) declares ultra-logger as a git dependency on the private
# LoggingEngine repository. Resolve it to the sibling checkout that this workspace already uses, so builds need no
# git credentials (CI and the Docker build have none) and the graph contains a single copy of the logger.
[patch."https://github.com/Nwagbara-Group-LLC/LoggingEngine"]
ultra-logger = { path = "../LoggingEngine/ultra-logger" }
