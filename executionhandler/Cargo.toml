[package]
name = "executionhandler"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async runtime and utilities
tokio = { version = "1.45.1", features = ["full"] }
tokio-tungstenite = { version = "0.24.0", features = ["native-tls"] }
futures-util = "0.3.31"

# HTTP client for REST API
reqwest = { version = "0.12.0", features = ["json", "native-tls"] }
hyper = { version = "1.4.0", features = ["full"] }

# Serialization and parsing
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_urlencoded = "0.7.1"

# Cryptography for API authentication
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"

# Time handling
chrono = { version = "0.4.41", features = ["serde"] }

# Error handling and utilities
anyhow = "1.0.97"
thiserror = "2.0.5"
uuid = "1.17.0"

# High-performance collections and concurrency
dashmap = "6.1.0"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
parking_lot = "0.12.4"
arc-swap = "1.7.0"

# Metrics and monitoring
ultra-logger = { workspace = true }
log-aggregator = { workspace = true }
metrics-collector = { workspace = true }
log = "0.4.22"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# Low-level optimizations
bytes = "1.10.1"
smallvec = "1.15.0"
async-trait = "0.1.83"

# Hardware optimizations 
once_cell = "1.20.2"
rayon = "1.10.0"
num_cpus = "1.16.0"

# Platform-specific optimizations
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.165"
nix = "0.29.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winbase", "processthreadsapi", "winnt"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
core_arch = "0.1.0"

# Local dependencies
signalgenerator = { path = "../signalgenerator" }
smartorderrouter = { path = "../smartorderrouter" }
exchangemetricaggregator = { path = "../exchangemetricaggregator" }
