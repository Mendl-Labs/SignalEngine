# ==============================================================================
# Development Environment Configuration for SignalEngine
# ==============================================================================

global:
  environment: dev
  registry:
    url: "localhost:5000"
    secretName: ""

# Single replica for development
replicaCount: 1

# Development image configuration
image:
  repository: "signal-engine"
  tag: "dev"
  pullPolicy: Always

# Minimal resources for development
resources:
  limits:
    cpu: "2000m"        # 2 CPU cores
    memory: "4Gi"       # 4GB RAM
    ephemeral-storage: "10Gi"
  requests:
    cpu: "500m"         # 0.5 CPU core
    memory: "1Gi"       # 1GB RAM
    ephemeral-storage: "2Gi"

# Disabled autoscaling for development
autoscaling:
  enabled: false

# Development persistence (smaller size)
persistence:
  enabled: true
  storageClass: "standard"
  size: 10Gi

# Development ingress
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: signal-engine.dev.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Development monitoring (basic)
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: false
  tracing:
    enabled: false
  logging:
    enabled: true
    fluentd:
      enabled: false

# Relaxed security for development
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000

# No network policies in development
networkPolicy:
  enabled: false

# No specific node selection for development
nodeSelector: {}

# No tolerations for development
tolerations: []

# No strict affinity for development
affinity: {}

# Lower priority for development
priorityClassName: ""

# No backup in development
backup:
  enabled: false

# Local external services for development
externalServices:
  messageBroker:
    enabled: true
    type: redis
    host: redis.dev.svc.cluster.local
    port: 6379
    database: 0
    tls: false
    
  database:
    enabled: true
    type: postgresql
    host: postgres.dev.svc.cluster.local
    port: 5432
    database: signal_engine_dev
    ssl: false
    
  marketData:
    enabled: false  # Use mock data in development

# Development environment variables
env:
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: RUST_LOG
    value: "signal_engine=debug,ultra_signal=debug"
  - name: ENVIRONMENT
    value: "development"
  - name: MOCK_DATA
    value: "true"

# Development tools enabled
development:
  enabled: true
  debug:
    enabled: true
    port: 40000
  profiling:
    enabled: true
    port: 6060

# Development health checks (faster)
startupProbe:
  httpGet:
    path: /health/startup
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 10
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /health/live
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health/ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1