[package]
name = "datahandler"
version = "0.1.0"
edition = "2021"

[dependencies]
config = { path = "../config" }
dashmap = "6.1.0"
dotenv = "0.15.0"
lazy_static = "1.5.0"
orderbook = { path = "../orderbook" }
ultra_signal = { path = "../signal" }
signalgenerator = { path = "../signalgenerator" }
crossbeam = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
# Message broker integration
protocol = { path = "../../../MessageBrokerEngine/protocol" }
subscriber = { path = "../../../MessageBrokerEngine/subscriber" }
prost = "0.13.5"
spin_sleep = "1.3.1"
