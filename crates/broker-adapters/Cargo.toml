[package]
name = "broker-adapters"
description = "Broker adapters for the Mendl Labs rebalancer: pure signing/order/parse logic with HTTP behind a trait."
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
# Optional real transport. NOT in the default feature set: rustls/ring may not build on
# Windows-on-ARM. Enable with `--features reqwest-transport` where the toolchain supports it.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }

[features]
default = []
reqwest-transport = ["dep:reqwest"]
