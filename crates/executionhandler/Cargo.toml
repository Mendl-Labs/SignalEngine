[package]
name = "executionhandler"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async runtime and utilities
signalengine = { package = "signalengine-core", path = "../core" }
tokio = { version = "1.45.1", features = ["full"] }
tokio-tungstenite = { version = "0.24.0", features = ["native-tls"] }
futures-util = "0.3.31"
futures = "0.3.31"

# HTTP client for REST API
reqwest = { version = "0.12.0", features = ["json", "native-tls"] }
hyper = { version = "1.4.0", features = ["full"] }

# Serialization and parsing
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_urlencoded = "0.7.1"

# Cryptography for API authentication
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"

# Time handling
chrono = { version = "0.4.41", features = ["serde"] }

# Error handling and utilities
anyhow = "1.0.97"
thiserror = "2.0.5"
uuid = { version = "1.17.0", features = ["v4"] }

# High-performance collections and concurrency
dashmap = "6.1.0"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
parking_lot = "0.12.4"
arc-swap = "1.7.0"

# Metrics and monitoring
ultra-logger = { workspace = true }
log = "0.4.22"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# Low-level optimizations
bytes = "1.10.1"
smallvec = "1.15.0"
async-trait = "0.1.83"

# Blockchain SDKs for DEX integration
# SUI Network (Priority - built for HFT)
# Using HTTP JSON-RPC for SUI interaction (pure Rust, no OpenSSL issues)
ed25519-dalek = "2.1"         # Ed25519 signatures for SUI
hex = "0.4"                    # Hex encoding/decoding
blake2 = "0.10"                # Blake2b hashing for SUI addresses
rand = "0.8"                   # Random key generation for testing
bcs = "0.1.6"                  # Binary Canonical Serialization for SUI transactions
# Solana Network (Alternative fast chain)
# solana-client = "2.1.0"  # Commented out - requires OpenSSL on Windows
# solana-sdk = "2.1.0"     # Commented out - requires OpenSSL on Windows
# Ethereum/EVM (Lower priority due to latency)
# ethers = { version = "2.0", features = ["ws", "rustls"] } # Commented out - OpenSSL issues on Windows
# Note: Will implement HTTP JSON-RPC approach for all chains to avoid OpenSSL dependencies

# Hardware optimizations 
once_cell = "1.20.2"
rayon = "1.10.0"
num_cpus = "1.16.0"
crc32fast = "1.4"  # For orderbook checksum validation
getrandom = "0.2"  # For trace ID generation
zeroize = { version = "1.8", features = ["derive"] }  # Secure memory clearing

# File system watching
notify = "7.0"

# YAML config support
serde_yaml = "0.9"

# Temp files for testing
tempfile = "3.14"

# Platform-specific optimizations
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.165"
nix = "0.29.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winbase", "processthreadsapi", "winnt"] }

# Note: std::arch::x86_64 intrinsics are used directly from std, no external crate needed

# Local dependencies
signalgenerator = { path = "../signalgenerator" }
smartorderrouter.workspace = true
exchangemetricaggregator = { path = "../exchangemetricaggregator" }

[features]
default = []
testing = []

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "latency_bench"
harness = false
