[package]
name = "mandate-core"
description = "Mandate types, validator, canonical hash and the documented-strategy library: verbatim copies of the Engine's mandate.rs and strategy_library.rs (see SOURCE.md). Pure, no I/O."
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
sha2 = "0.10"
hex = "0.4"
