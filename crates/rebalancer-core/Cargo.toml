[package]
name = "rebalancer-core"
description = "Pure rebalancer logic: mandate policy compiler, pre-trade guard and order planner. No network, no DB, no async."
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
mandate-core = { path = "../mandate-core" }
broker-adapters = { path = "../broker-adapters" }
reference-rules = { workspace = true }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
