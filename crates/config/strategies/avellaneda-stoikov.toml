type = "avellaneda-stoikov"
version = "1.0.0"
enabled = true
description = "High-frequency market making strategy based on optimal bid-ask spread calculation"

[parameters]
risk_aversion = 0.1
inventory_target = 0.0
order_size = 100.0
window_ms = 1000
min_quote_lifetime_ms = 100
fee_rate = 0.001
latency_buffer = 0.5
