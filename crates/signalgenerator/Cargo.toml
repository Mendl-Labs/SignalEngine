[package]
name = "signalgenerator"
version = "0.1.0"
edition = "2021"

[dependencies]
signalengine = { package = "signalengine-core", path = "../core" }
crossbeam = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
uuid = { version = "1.17.0", features = ["v4"] }
tokio = { version = "1.0", features = ["full"] }
bigdecimal = "0.3"
anyhow = "1.0"
ultra_signal = { path = "../signal" }
