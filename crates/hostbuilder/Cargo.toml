[package]
name = "hostbuilder"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.88"
config = { path = "../config", package = "signalengine-config" }
crossbeam = "0.8.4"
ctrlc = "3.4.7"
dashmap = "6.1.0"
datahandler = { path = "../datahandler" }
dotenv = "0.15.0"
executionhandler = { path = "../executionhandler" }
lazy_static = "1.5.0"
mockall = "0.13.1"
orderbook = { path = "../orderbook" }
portfolio = { path = "../portfolio" }
portfoliohandler = { path = "../portfoliohandler" }
serde_json = "1.0.140"
smartorderrouter = { path = "../smartorderrouter" }
strategyhandler = { path = "../strategyhandler" }
strategyloader = { path = "../strategyloader" }
databaseschema = { path = "../../../databaseschema", optional = true }
# Reused for warm-starting a strategy's bar history from Polygon/Massive
# historical candles on init, instead of starting from zero bars after
# every restart -- forex backtests already use this same provider as a
# proxy for Oanda (no historical Oanda candle API exists in this codebase),
# so this isn't a new/different data source, just the same one reused live.
dataloader = { path = "../../../BacktestingCore/dataloader", optional = true }
bigdecimal = { version = "0.4", optional = true }
chrono = { version = "0.4", features = ["serde"] }
tokio = "1.44.1"
ultra_signal = { path = "../signal" }
uuid = { version = "1.0", features = ["v4"] }

# Ultra-low latency logging
ultra-logger = { workspace = true }

# Phase 2: Ultra-Fast Order Management Dependencies
bytes = { workspace = true }
bincode = { workspace = true }
futures = { workspace = true }
atomic = { workspace = true }
fastrand = { workspace = true }
serde = { workspace = true }

[features]
default = []
postgres = ["databaseschema", "dataloader", "bigdecimal", "executionhandler/postgres", "smartorderrouter/postgres", "strategyloader/postgres"]
