[package]
name = "market-data"
description = "Production market-data sources for the rebalancer: MassiveDataSource, a `rebalancer_run::data::DataSource` over the Massive (formerly Polygon.io) daily-aggregates REST API. HTTP behind broker-adapters' HttpTransport (no new HTTP stack); pure and offline in tests."
version = "0.0.1"
edition = "2021"
publish = false

# Dependency direction: this crate depends on rebalancer-run (it implements its `DataSource` trait), never the other
# way round, so the pure, offline `rebalancer-run` keeps no knowledge of any vendor. Every dependency below is already
# in the workspace graph (rebalancer-run / broker-adapters use them); nothing new, in particular no HTTP client, is
# compiled unless the opt-in `live` feature is enabled.
[dependencies]
broker-adapters = { path = "../broker-adapters" }
rebalancer-core = { path = "../rebalancer-core" }
rebalancer-run = { path = "../rebalancer-run" }
reference-rules = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[features]
default = []
# The real network transport (reqwest, blocking, rustls) for the env-gated live test and for a production wiring
# crate to reuse. OFF by default; never part of the normal workspace build of the shipped binaries.
live = ["broker-adapters/reqwest-transport"]
