# ==============================================================================
# SignalEngine - Ultra-Low Latency Trading Platform Helm Chart Configuration
# ==============================================================================

# Global configuration
global:
  # Environment: dev, qa, prod
  environment: dev
  
  # Registry configuration
  registry:
    url: ""
    secretName: ""
  
  # Time zone for all containers
  timezone: "UTC"
  
  # Cluster domain
  clusterDomain: cluster.local

# ==============================================================================
# Application Configuration
# ==============================================================================

# Replica count for the main signal engine
replicaCount: 1

# Container image configuration
image:
  repository: busybox
  pullPolicy: IfNotPresent
  tag: "latest"

# Command and args for test container
command: ["/bin/sh"]
args: ["-c", "echo 'SignalEngine test pod started'; while true; do echo 'SignalEngine API simulation - $(date)'; sleep 30; done"]

# Image pull secrets for private registries
imagePullSecrets: []
  # - name: registry-secret

# Override chart names
nameOverride: ""
fullnameOverride: ""

# ==============================================================================
# Service Account & RBAC
# ==============================================================================

serviceAccount:
  # Create service account
  create: true
  # Auto-mount API credentials
  automount: true
  # Service account annotations
  annotations: {}
  # Service account name (generated if empty)
  name: ""

# RBAC configuration
rbac:
  create: true
  rules:
    # Add custom RBAC rules for trading operations
    - apiGroups: [""]
      resources: ["secrets", "configmaps"]
      verbs: ["get", "list"]
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets"]
      verbs: ["get", "list", "watch"]

# ==============================================================================
# Pod Configuration
# ==============================================================================

# Pod annotations (for monitoring, security, etc.)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Pod labels
podLabels:
  app.kubernetes.io/component: signal-engine
  tier: trading

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# ==============================================================================
# Service Configuration
# ==============================================================================

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Additional ports for different components
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: 8081
      protocol: TCP

# ==============================================================================
# Ingress Configuration
# ==============================================================================

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Rate limiting for API endpoints
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: signal-engine.local
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
        - path: /health
          pathType: Prefix
  tls:
    - secretName: signal-engine-tls
      hosts:
        - signal-engine.local

# ==============================================================================
# Resource Management
# ==============================================================================

# Resource requests and limits (critical for trading systems)
resources:
  limits:
    cpu: "4000m"      # 4 CPU cores for high throughput
    memory: "8Gi"     # 8GB RAM for in-memory processing
    ephemeral-storage: "10Gi"
  requests:
    cpu: "2000m"      # Guaranteed 2 CPU cores
    memory: "4Gi"     # Guaranteed 4GB RAM
    ephemeral-storage: "5Gi"

# ==============================================================================
# Health Checks & Probes
# ==============================================================================
# For dev/test: Using busybox, check for the shell process
# For production: Change to pgrep signal-engine when using the real image

# Startup probe - verify process starts successfully
startupProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep -f "sleep 30"  # Dev: check busybox loop; Prod: change to signal-engine
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
  successThreshold: 1

# Liveness probe - verify process is still running
livenessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep -f "sleep 30"  # Dev: check busybox loop; Prod: change to signal-engine
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Readiness probe - verify process is ready to handle signals
readinessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep -f "sleep 30"  # Dev: check busybox loop; Prod: change to signal-engine
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# ==============================================================================
# Autoscaling Configuration
# ==============================================================================
# NOTE: Autoscaling disabled by default because custom metrics require 
# metrics-server and custom metrics adapter to be installed in the cluster.
# Enable only when prometheus-adapter or KEDA is configured.

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Custom metrics for trading-specific scaling (requires prometheus-adapter)
  # customMetrics:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: signal_processing_rate
  #       target:
  #         type: AverageValue
  #         averageValue: "1000"  # Signals per second

# Vertical Pod Autoscaler
vpa:
  enabled: false
  updateMode: "Auto"  # Auto, Initial, Off

# Pod Disruption Budget (disabled for dev - enable in production)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 25%

# ==============================================================================
# Storage Configuration
# ==============================================================================

# Persistent volumes (disabled for dev - PVC volume mount uses emptyDir instead)
persistence:
  enabled: false  # Disabled for dev - enable in production
  storageClass: ""  # Use default cluster storage class
  accessMode: ReadWriteOnce
  size: 100Gi
  annotations: {}

# Volume mounts
volumeMounts:
  - name: config-volume
    mountPath: /etc/signal-engine
    readOnly: true
  - name: data-volume
    mountPath: /data
  - name: logs-volume
    mountPath: /var/log/signal-engine
  - name: tmp-volume
    mountPath: /tmp

# Volumes (now defined in deployment template with proper naming)
# volumes section removed - configmap name is templated in deployment.yaml

# ==============================================================================
# Environment Variables & Configuration
# ==============================================================================

# Environment variables
env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: RUST_LOG
    value: "signal_engine=debug,ultra_signal=debug"
  - name: ENVIRONMENT
    value: "{{ .Values.global.environment }}"
  - name: TZ
    value: "{{ .Values.global.timezone }}"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://jaeger-collector:14268"

# ConfigMap data
configMap:
  enabled: true
  data:
    config.toml: |
      # SignalEngine Configuration
      [server]
      host = "0.0.0.0"
      port = 8080
      
      [logging]
      level = "info"
      format = "json"
      
      [trading]
      max_orders_per_second = 10000
      latency_threshold_us = 100
      
      [exchanges]
      binance_enabled = true
      coinbase_enabled = true
      kraken_enabled = true

# ==============================================================================
# Application Configuration
# ==============================================================================

config:
  # Environment
  environment: "development"
  log_level: "info"
  
  # Tenant ID for multi-tenant credential loading from database
  # Set this to your tenant UUID to enable loading exchange credentials from the database
  tenantId: ""
  
  # Message broker configuration
  message_broker:
    address: "localhost"
    port: 5672
    max_connections: 10
    buffer_size: 8192
    compression_enabled: true
    batch_size: 1000
    flush_interval: "100ms"
  
  # Topic configuration
  publish_topics:
    - "orders.btc"
    - "orders.eth"
    - "signals.trading"
  
  subscribe_topics:
    - "market_data.orderbook"
    - "portfolio.balances"
    - "executions.fills"
  
  # Topic routing
  topic_routing:
    signals: "signals.trading"
    orders: "orders.execution"
    fills: "executions.fills"
    positions: "portfolio.positions"
  
  # Strategy configurations
  strategies:
    - id: "market_maker_btc"
      name: "BTC Market Maker"
      strategy_type: "MarketMaking"
      enabled: true
      symbols: ["BTC/USD"]
      exchanges: ["kraken"]
      parameters:
        spread_target: 0.0005
        inventory_limit: 10.0
      risk_limits:
        max_position_size: 10.0
        max_order_size: 1.0
        max_daily_loss: 1000.0
        max_position_value: 50000.0
  
  # Exchange configurations
  exchanges:
    - name: "kraken"
      enabled: true
      sandbox: false
      rate_limits:
        orders_per_second: 10
        requests_per_second: 50
        window_size: "60s"
      timeout: "30s"
    - name: "binance"
      enabled: true
      sandbox: false
      rate_limits:
        orders_per_second: 20
        requests_per_second: 100
        window_size: "60s"
      timeout: "30s"
  
  # Security configuration
  security:
    api_key_required: false
    request_signing_required: false
    rate_limiting_enabled: true
    max_requests_per_minute: 1000
    blocked_ips: []
    allowed_ips: []
    encryption_enabled: true

# Performance configuration
performance:
  worker_threads: 4
  cpu_affinity_enabled: false
  cpu_cores: []
  memory_limit_mb: 1024
  latency_threshold_us: 100
  metrics_enabled: true
  metrics_interval: "60s"
  simd_enabled: true

# Trading configuration
trading:
  max_orders_per_second: 10000
  latency_threshold_us: 100

# Strategy configuration
strategies:
  market_maker:
    enabled: true

# Exchange feature flags (NOT credentials — credentials are BYOK and stored
# encrypted per-tenant in the `exchange_credentials` table). These flags only
# control whether the runtime-config.yaml lists the exchange as a known
# connector target. Adding/removing an entry here does not grant access; users
# must still upload their own API keys via the Settings UI.
exchanges:
  kraken:
    enabled: true
    sandbox: false
  binance:
    enabled: true
    sandbox: false

# Secrets (stored separately for security)
# DO NOT PUT REAL CREDENTIALS IN THIS FILE - IT GOES TO GIT
#
# NOTE: Per-tenant exchange API keys are NOT configured here. Users add their
# own keys for any supported exchange via the Settings UI; they are stored
# encrypted in the `exchange_credentials` table and loaded by SignalEngine on
# demand through a tenant-scoped smartorderrouter::CredentialProvider (see
# UltraLowLatencyExecutionHandler::initialize_from_provider and
# ensure_exchange_for_tenant). The public build only ships a single-tenant
# provider bound to TENANT_ID; the multi-tenant provider is injected by the
# private host binary.
secrets:
  # Database credentials
  database:
    password: "YOUR_DATABASE_PASSWORD_HERE"

  # Redis credentials
  redis:
    password: "YOUR_REDIS_PASSWORD_HERE"

  # Message broker credentials
  messageBroker:
    password: "YOUR_MESSAGE_BROKER_PASSWORD_HERE"

# ==============================================================================
# Performance & Optimization
# ==============================================================================

# Node selection (empty for compatibility with any cluster)
nodeSelector: {}

# Pod tolerations (empty for compatibility with any cluster)
tolerations: []

# Pod affinity and anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - signal-engine-helm
          topologyKey: kubernetes.io/hostname

# Priority class for critical trading workloads
# Set to "" for compatibility with clusters that don't have custom PriorityClasses
priorityClassName: ""

# Topology spread constraints (empty for single-node dev cluster)
topologySpreadConstraints: []

# ==============================================================================
# Monitoring & Observability
# ==============================================================================

monitoring:
  # Enable Prometheus monitoring
  prometheus:
    enabled: true
    port: 9090
    # Service monitor for Prometheus operator (requires prometheus-operator CRDs)
    serviceMonitor:
      enabled: false  # Set to true if prometheus-operator is installed
      interval: 15s
      path: /metrics
      labels:
        app: signal-engine
    # Prometheus rules (requires prometheus-operator CRDs)
    rules:
      enabled: false  # Set to true if prometheus-operator is installed
    
  # Health checks
  health_check_enabled: true
  health_check_interval: "30s"
  metrics_retention_days: 7
  alerting_enabled: false
  
  # Alert thresholds
  alert_thresholds:
    latency_us: 1000.0
    error_rate_percent: 5.0
    cpu_usage_percent: 80.0
    memory_usage_percent: 85.0
    connection_failures: 10
    
  # Enable Grafana dashboards
  grafana:
    enabled: true
    dashboards:
      enabled: true

  # Distributed tracing
  tracing:
    enabled: true
    jaeger:
      endpoint: "http://jaeger-collector:14268/api/traces"

# ==============================================================================
# Logging Configuration
# ==============================================================================

logging:
  enabled: true
  level: "info"
  format: "json"
  outputs: ["stdout"]
  structured_logging: true
  max_file_size_mb: 100
  max_files: 5
  # Log aggregation
  fluentd:
    enabled: true
  # Log shipping to external systems
  elasticsearch:
    enabled: false
    endpoint: ""

# ==============================================================================
# Networking & Security
# ==============================================================================

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443  # HTTPS
        - protocol: TCP
          port: 53   # DNS
        - protocol: UDP
          port: 53   # DNS

# Pod Security Policy
podSecurityPolicy:
  enabled: true

# ==============================================================================
# External Dependencies
# ==============================================================================

# External services configuration
externalServices:
  # Message broker (Redis/RabbitMQ)
  messageBroker:
    enabled: true
    type: redis
    host: redis-service
    port: 6379
    database: 0
    
  # Database
  database:
    enabled: true
    type: postgresql
    host: postgres-service
    port: 5432
    database: signal_engine
    
  # Market data feeds
  marketData:
    enabled: true
    providers:
      - name: binance
        endpoint: "wss://stream.binance.com:9443"
      - name: coinbase
        endpoint: "wss://ws-feed.pro.coinbase.com"

# ==============================================================================
# Backup & Disaster Recovery
# ==============================================================================

backup:
  enabled: false
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  storage:
    type: s3
    bucket: "signal-engine-backups"
    region: "us-east-1"

# ==============================================================================
# Development & Testing
# ==============================================================================

# Development tools
development:
  enabled: false
  debug:
    enabled: false
    port: 40000
  profiling:
    enabled: false
    port: 6060

# Testing configuration
testing:
  enabled: false
  load:
    enabled: false
    duration: "10m"
    rate: "1000rps"

# =============================================================================
# Per-Tenant Resource Isolation
# =============================================================================
# Deploy per-tenant with: helm install tenant-<id> . --namespace tenant-<id>
#   --set tenantResources.enabled=true --set tenantResources.tenantId=<uuid>
#   --set tenantResources.tier=<explorer|trader|professional|institution|enterprise>

tenantResources:
  enabled: false
  tenantId: ""
  tier: "explorer"

  profiles:
    explorer:
      maxCpu: "2"
      maxMemory: "4Gi"
      maxCpuLimit: "4"
      maxMemoryLimit: "8Gi"
      maxPods: "3"
      maxPVCs: "1"
      maxServices: "2"
      maxEphemeralStorage: "5Gi"
      defaultContainerCpuRequest: "250m"
      defaultContainerCpuLimit: "1000m"
      defaultContainerMemoryRequest: "512Mi"
      defaultContainerMemoryLimit: "2Gi"
      maxContainerCpu: "2000m"
      maxContainerMemory: "4Gi"
      maxPodCpu: "2000m"
      maxPodMemory: "4Gi"

    trader:
      maxCpu: "4"
      maxMemory: "16Gi"
      maxCpuLimit: "8"
      maxMemoryLimit: "32Gi"
      maxPods: "5"
      maxPVCs: "2"
      maxServices: "3"
      maxEphemeralStorage: "10Gi"
      defaultContainerCpuRequest: "500m"
      defaultContainerCpuLimit: "2000m"
      defaultContainerMemoryRequest: "1Gi"
      defaultContainerMemoryLimit: "4Gi"
      maxContainerCpu: "4000m"
      maxContainerMemory: "8Gi"
      maxPodCpu: "4000m"
      maxPodMemory: "8Gi"

    professional:
      maxCpu: "16"
      maxMemory: "64Gi"
      maxCpuLimit: "32"
      maxMemoryLimit: "128Gi"
      maxPods: "10"
      maxPVCs: "5"
      maxServices: "5"
      maxEphemeralStorage: "25Gi"
      defaultContainerCpuRequest: "1000m"
      defaultContainerCpuLimit: "4000m"
      defaultContainerMemoryRequest: "4Gi"
      defaultContainerMemoryLimit: "8Gi"
      maxContainerCpu: "8000m"
      maxContainerMemory: "32Gi"
      maxPodCpu: "8000m"
      maxPodMemory: "32Gi"

    institution:
      maxCpu: "64"
      maxMemory: "256Gi"
      maxCpuLimit: "128"
      maxMemoryLimit: "512Gi"
      maxPods: "25"
      maxPVCs: "10"
      maxServices: "10"
      maxEphemeralStorage: "100Gi"
      defaultContainerCpuRequest: "2000m"
      defaultContainerCpuLimit: "8000m"
      defaultContainerMemoryRequest: "8Gi"
      defaultContainerMemoryLimit: "32Gi"
      maxContainerCpu: "16000m"
      maxContainerMemory: "64Gi"
      maxPodCpu: "16000m"
      maxPodMemory: "64Gi"

    enterprise:
      maxCpu: "128"
      maxMemory: "512Gi"
      maxCpuLimit: "256"
      maxMemoryLimit: "1Ti"
      maxPods: "50"
      maxPVCs: "20"
      maxServices: "20"
      maxEphemeralStorage: "250Gi"
      defaultContainerCpuRequest: "4000m"
      defaultContainerCpuLimit: "16000m"
      defaultContainerMemoryRequest: "16Gi"
      defaultContainerMemoryLimit: "64Gi"
      maxContainerCpu: "32000m"
      maxContainerMemory: "128Gi"
      maxPodCpu: "32000m"
      maxPodMemory: "128Gi"
