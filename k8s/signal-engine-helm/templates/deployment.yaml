apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signal-engine-helm.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "signal-engine-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: signal-engine
  annotations:
    deployment.kubernetes.io/revision: "{{ .Release.Revision }}"
    {{- if .Values.global.environment }}
    environment: {{ .Values.global.environment }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "signal-engine-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        deployment.kubernetes.io/revision: "{{ .Release.Revision }}"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "signal-engine-helm.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        version: {{ .Values.image.tag | default .Chart.AppVersion }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "signal-engine-helm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- if .Values.env }}
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            # Database connection - constructed from secrets created by CI/CD from Azure Key Vault
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: signalengine-db-secret
                  key: host
                  optional: true
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: signalengine-db-secret
                  key: port
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: signalengine-db-secret
                  key: username
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signalengine-db-secret
                  key: password
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: signalengine-db-secret
                  key: database
                  optional: true
            # Tenant ID for multi-tenant credential loading
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "signal-engine-helm.fullname" . }}-config
                  key: tenant-id
                  optional: true
            # System environment variables
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
          # Lifecycle hooks for graceful shutdown
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 15"  # Allow time for load balancer to drain connections
      {{- if .Values.development.enabled }}
        # Debug sidecar container (only in development)
        - name: debug-sidecar
          image: busybox:1.35
          command: ['sleep', '3600']
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          {{- if .Values.development.debug.enabled }}
          ports:
            - name: debug
              containerPort: {{ .Values.development.debug.port }}
              protocol: TCP
          {{- end }}
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      {{- end }}
      volumes:
        # ConfigMap volume with properly templated name
        - name: config-volume
          configMap:
            name: {{ include "signal-engine-helm.fullname" . }}-config
        # Data volume - emptyDir for dev, PVC for production
        - name: data-volume
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "signal-engine-helm.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Logs and tmp as emptyDir
        - name: logs-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # DNS configuration for ultra-low latency
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: edns0
