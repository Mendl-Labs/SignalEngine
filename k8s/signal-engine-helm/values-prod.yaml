# ==============================================================================
# SignalEngine Production Values — Hetzner k3s single-node
# Trigger rebuild: picks up fix for PublisherConfig double-port bug (cf75fbd)
# ==============================================================================

global:
  environment: prod

# PARKED (R74 A3a, 2026-10-22): the old "deployed strategies" live path is
# scaled to zero in production. The paper rebalancer (k8s/rebalancer-helm,
# release rebalancer-pilot) runs Dragonstone and shares no runtime code or
# messages with this pod. CI's prod deploy job still runs `helm upgrade` on
# every merge to main; with 0 here it keeps the Deployment at 0 pods.
# Unpark: set this back to 1 (or `kubectl scale --replicas=1`, which the next
# merge would undo). Gating the CI deploy job itself is R74 A3b, a later PR.
replicaCount: 0

image:
  pullPolicy: IfNotPresent

# Override test command from default values — use Dockerfile CMD
command: []
args: []

imagePullSecrets:
  - name: ghcr-secret

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# Storage
persistence:
  enabled: true
  storageClass: "local-path"
  size: 20Gi

# Disable cloud-only features
autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: false

# Full config in proper YAML format (matching serde struct expectations)
configMap:
  enabled: true
  data:
    signal-engine-config.yaml: |
      environment: Production
      message_broker:
        address: "message-broker-engine.messagebroker.svc.cluster.local"
        port: 8081
        max_connections: 1000
        buffer_size: 10240
        compression_enabled: true
        batch_size: 100
        flush_interval:
          secs: 0
          nanos: 100000000
      publish_topics:
        - "signals.buy"
        - "signals.sell"
        - "signals.market_making"
        - "orders.execution"
      subscribe_topics:
        - "market.kraken.btcusd"
        - "market.kraken.ethusd"
        - "market.data.feed"
        - "portfolio.updates"
        - "wallet.balances"
      topic_routing:
        signals: "signals.trading"
        orders: "orders.execution"
        fills: "executions.fills"
        positions: "portfolio.positions"
      strategies:
        - id: "momentum_strategy"
          name: "Ultra Fast Momentum"
          strategy_type: "momentum"
          enabled: true
          symbols: ["BTC/USD", "ETH/USD"]
          exchanges: ["kraken"]
          parameters:
            lookback_period: 20
            threshold: 0.02
          risk_limits:
            max_position_size: 10000.0
            max_order_size: 5000.0
            max_daily_loss: 1000.0
            max_position_value: 50000.0
      # Exchange API keys are NOT configured here. Users add their own keys via the
      # Settings UI (stored encrypted in `exchange_credentials`). Production runs
      # with config.credentialMode=none (values.yaml default): NO credential provider,
      # live trading disabled, live deployments rejected loudly; paper trading only.
      # The single-tenant provider (config.credentialMode=single_tenant + tenantId)
      # is for self-hosted, one-tenant installs. An opt-in multi-tenant provider
      # (config.credentialMode=multi_tenant, private schema) exists but production
      # deliberately stays on `none` until the owner decides otherwise.
      exchanges: []
      performance:
        worker_threads: 4
        cpu_affinity_enabled: false
        cpu_cores: [0, 1, 2, 3]
        memory_limit_mb: 4096
        latency_threshold_us: 100
        metrics_enabled: true
        metrics_interval:
          secs: 1
          nanos: 0
        simd_enabled: true
      security:
        api_key_required: false
        request_signing_required: false
        rate_limiting_enabled: true
        max_requests_per_minute: 1000
        blocked_ips: []
        allowed_ips: []
        encryption_enabled: false
      monitoring:
        health_check_enabled: true
        health_check_interval:
          secs: 30
          nanos: 0
        metrics_retention_days: 7
        alerting_enabled: false
        alert_thresholds:
          latency_us: 5000.0
          error_rate_percent: 5.0
          cpu_usage_percent: 80.0
          memory_usage_percent: 85.0
          connection_failures: 10
        prometheus_enabled: true
        prometheus_port: 9090
      logging:
        level: "info"
        format: "json"
        output: ["stdout"]
        file_path: null
        max_file_size_mb: 100
        max_files: 5
        structured_logging: true

# No special node selectors for single-node
nodeSelector: {}
tolerations: []
priorityClassName: ""
topologySpreadConstraints: []

# Monitoring — disable ServiceMonitor (no Prometheus operator CRDs)
monitoring:
  prometheus:
    serviceMonitor:
      enabled: false
    rules:
      enabled: false
  alerting_enabled: false

# Logging — disable Elasticsearch (optional)
logging:
  level: "info"
  elasticsearch:
    enabled: false

# Health probes
startupProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep signal-engine
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
  successThreshold: 1

livenessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep signal-engine
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep signal-engine
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

affinity: {}

# Override env to add CONFIG_PATH
env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: RUST_LOG
    value: "signal_engine=info"
  - name: ENVIRONMENT
    value: "prod"
  - name: TZ
    value: "UTC"
  - name: CONFIG_PATH
    value: "/etc/signal-engine/signal-engine-config.yaml"
  # The real connect paths in datahandler and MessageBrokerEngine's
  # subscriber crate both resolve the broker address straight from these
  # two env vars (defaulting to localhost:8080 if unset) -- they never read
  # CONFIG_PATH's message_broker.address field above, which is otherwise
  # unused dead code. Must match the real in-cluster Service/port exactly.
  - name: MESSAGE_BROKER_HOST
    value: "message-broker-engine.messagebroker.svc.cluster.local"
  - name: MESSAGE_BROKER_PORT
    value: "8081"
  # Matches this pod's resources.limits.cpu (4000m, above) -- see
  # program/src/main.rs's doc comment on why this must track the real CPU
  # limit rather than defaulting to the host's full core count.
  - name: TOKIO_WORKER_THREADS
    value: "4"
