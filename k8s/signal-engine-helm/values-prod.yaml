# ==============================================================================
# SignalEngine Production Values — Hetzner k3s single-node
# ==============================================================================

global:
  environment: prod

replicaCount: 1

image:
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# Storage
persistence:
  enabled: true
  storageClass: "local-path"
  size: 20Gi

# Disable cloud-only features
autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

# No special node selectors for single-node
nodeSelector: {}
tolerations: []
priorityClassName: ""
topologySpreadConstraints: []

# Monitoring — disable ServiceMonitor (no Prometheus operator CRDs)
monitoring:
  prometheus:
    serviceMonitor:
      enabled: false
    rules:
      enabled: false
  alerting_enabled: false

# Logging — disable Elasticsearch (optional)
logging:
  level: "info"
  elasticsearch:
    enabled: false

# Health probes
startupProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep signal-engine
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
  successThreshold: 1

livenessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep signal-engine
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pgrep signal-engine
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

affinity: {}
