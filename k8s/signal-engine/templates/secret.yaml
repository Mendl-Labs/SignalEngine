apiVersion: v1
kind: Secret
metadata:
  name: {{ include "signal-engine-helm.fullname" . }}-secret
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "signal-engine-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Kraken API credentials (Base64 encoded by Helm)
  {{- if .Values.secrets.kraken.apiKey }}
  KRAKEN_API_KEY: {{ .Values.secrets.kraken.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.kraken.secretKey }}
  KRAKEN_SECRET_KEY: {{ .Values.secrets.kraken.secretKey | b64enc | quote }}
  {{- end }}
  
  # Database credentials
  {{- if .Values.secrets.database.password }}
  DATABASE_PASSWORD: {{ .Values.secrets.database.password | b64enc | quote }}
  {{- end }}
  
  # Redis credentials
  {{- if .Values.secrets.redis.password }}
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | b64enc | quote }}
  {{- end }}
  
  # Message broker credentials
  {{- if .Values.secrets.messageBroker.password }}
  MESSAGE_BROKER_PASSWORD: {{ .Values.secrets.messageBroker.password | b64enc | quote }}
  {{- end }}
