# SignalEngine CI/CD Pipeline
# Builds on ubuntu-latest, deploys to k3s on Hetzner via GHCR

name: SignalEngine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false
      deploy_prod:
        description: 'Force a manual production deploy on this run (production also deploys automatically on every push to main once deploy-qa passes)'
        type: boolean
        default: false
      enable_live_credentials:
        description: 'Also copy the credentials-encryption key so SignalEngine can decrypt user exchange API keys (live trading). Leave off for a paper-only deployment.'
        type: boolean
        default: false

concurrency:
  group: signal-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/mendl-labs/signal-engine
  NAMESPACE: signalengine
  HELM_CHART_PATH: k8s/signal-engine-helm
  DOCKER_BUILDKIT: 1

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed || steps.skip-test-result.outputs.passed }}
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          path: SignalEngine

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema

      - name: Checkout SimulationEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/SimulationEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: SimulationEngine

      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/BacktestingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: BacktestingEngine

      - name: Checkout BacktestingCore
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/BacktestingCore
          # hostbuilder and strategyhandler use path dependencies on this repo's dataloader and
          # quant-diagnostics crates; pin a tag so CI is reproducible.
          ref: v0.1.51
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: BacktestingCore

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # python3-dev: pyo3 (crates/pythonbridge-worker) links libpython at
          # build time. python3-numpy/python3-pandas: the pythonbridge-worker
          # test suite actually spawns the built worker binary and runs real
          # strategy code against it (tests/client_integration.rs), which
          # imports numpy/pandas just like a real deployment would.
          sudo apt-get install -y libssl-dev libpq-dev pkg-config python3-dev python3-numpy python3-pandas

      - name: Lint and render the Helm chart
        run: |
          cd SignalEngine
          helm lint k8s/signal-engine-helm -f k8s/signal-engine-helm/values-qa.yaml
          helm lint k8s/signal-engine-helm -f k8s/signal-engine-helm/values-prod.yaml
          for V in values-qa.yaml values-prod.yaml; do
            helm template signal-engine k8s/signal-engine-helm -f k8s/signal-engine-helm/$V \
              --set image.repository=example/signal-engine --set image.tag=ci > /dev/null
          done

      - name: Check for Skip Tests Flag
        id: check-skip
        run: |
          cd SignalEngine
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -q '\[skip-tests\]'; then
            echo "[SKIP] skip-tests flag detected"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Running full validation with tests"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast Check
        run: |
          cd SignalEngine
          cargo check --workspace
          echo "[OK] Fast check passed!"

      - name: Build Workspace
        run: |
          cd SignalEngine
          cargo build --workspace
          echo "[OK] Build passed!"

      - name: Clippy
        run: |
          cd SignalEngine
          cargo clippy --all-targets --workspace -- -D warnings
          echo "[OK] Clippy passed!"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Audit Dependencies
        run: |
          cd SignalEngine
          cargo audit --file Cargo.lock
          echo "[OK] Dependency audit passed!"

      - name: Run Tests
        if: steps.check-skip.outputs.skip != 'true' && github.event.inputs.skip_tests != 'true'
        id: test-result
        run: |
          cd SignalEngine
          # Run datahandler tests with single thread (uses global ORDERBOOKS state)
          cargo test -p datahandler -- --test-threads=1
          # pythonbridge-worker embeds a single, process-wide CPython
          # interpreter (pyo3 auto-initialize) with a persistent watchdog
          # thread whose _thread.interrupt_main() targets whichever OS
          # thread first touched Python -- running its tests in parallel
          # (cargo's default) makes different tests land on different
          # threads and race, confirmed via repeated local runs (serial:
          # 14/14 pass every time; parallel: 3/14 intermittently fail with
          # "python worker thread dropped result sender").
          cargo test -p pythonbridge-worker -- --test-threads=1
          # strategyhandler's PythonBridgeStrategy also spawns pythonbridge-worker
          # subprocesses (create_strategy/initialize) -- same PyO3 process-wide
          # interpreter contention as above. Confirmed locally: a freshly-added
          # bars_since_init test deterministically fails under the default
          # parallel runner (28/28 pass single-threaded every time; one
          # consistently fails in parallel), same category as the two carve-outs
          # above, not flaky/order-random.
          cargo test -p strategyhandler -- --test-threads=1
          # Run all other tests in parallel
          if cargo test --workspace --exclude datahandler --exclude pythonbridge-worker --exclude strategyhandler; then
            echo "[OK] Tests passed!"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "[FAIL] Tests failed!"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Skip Tests
        if: steps.check-skip.outputs.skip == 'true' || github.event.inputs.skip_tests == 'true'
        id: skip-test-result
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Install cargo-tarpaulin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo install cargo-tarpaulin --locked || true

      - name: Run Rust Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          cd SignalEngine
          cargo tarpaulin --workspace --out xml --output-dir ./coverage --timeout 300

      - name: Upload Coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: signalengine
          files: SignalEngine/coverage/cobertura.xml
          fail_ci_if_error: false

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.tests-passed == 'true' || github.event.inputs.skip_tests == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          path: SignalEngine
          fetch-depth: 0

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine
          fetch-depth: 0

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine
          fetch-depth: 0

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema
          fetch-depth: 0

      - name: Checkout SimulationEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/SimulationEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: SimulationEngine
          fetch-depth: 0

      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/BacktestingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: BacktestingEngine
          fetch-depth: 0

      - name: Checkout BacktestingCore
        uses: actions/checkout@v4
        with:
          repository: Mendl-Labs/BacktestingCore
          # hostbuilder and strategyhandler use path dependencies on this repo's dataloader and
          # quant-diagnostics crates; pin a tag so CI is reproducible.
          ref: v0.1.51
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: BacktestingCore
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Context
        run: |
          # IMPORTANT: Do NOT create a .dockerignore file at workspace root
          # SignalEngine Dockerfile copies the entire TradingPlatform workspace
          # A .dockerignore would exclude needed dependencies
          if [ -f ".dockerignore" ]; then
            echo "[WARN] Removing .dockerignore at context root"
            rm -f .dockerignore
          fi
          echo "[OK] No .dockerignore at context root"

      - name: Build & Push Image
        run: |
          set -e
          echo "Building Docker image..."

          REQUIRED_DEPS=("LoggingEngine" "MessageBrokerEngine" "databaseschema" "SimulationEngine" "BacktestingEngine" "BacktestingCore")
          for DEP in "${REQUIRED_DEPS[@]}"; do
            if [ -d "$DEP" ]; then
              echo "[OK] Dependency found: $DEP"
            else
              echo "[ERROR] Missing: $DEP"
              exit 1
            fi
          done

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "[INFO] Building with immutable tag: $SHORT_SHA"

          docker build \
            --platform linux/amd64 \
            --tag ${{ env.IMAGE_NAME }}:$SHORT_SHA \
            --file SignalEngine/Dockerfile \
            --progress=plain \
            .

          echo "[PUSH] Pushing image..."
          docker push ${{ env.IMAGE_NAME }}:$SHORT_SHA
          # :latest intentionally NOT pushed. Mutable tags + IfNotPresent pullPolicy
          # caused stale-image incidents (see 2026-05-30 audit). Deploy by SHA only.
          echo "[OK] Pushed image with tag: $SHORT_SHA (immutable SHA only)"

      - name: Security Scan
        continue-on-error: true
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "[SCAN] Running security scan with Trivy..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --exit-code 0 --format table ${{ env.IMAGE_NAME }}:$SHORT_SHA
          echo "[OK] Security scan complete"

      - name: Build Summary
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo ""
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Tag: $SHORT_SHA"
          echo "Pull: docker pull ${{ env.IMAGE_NAME }}:$SHORT_SHA"
          echo "=========================================="

  # QA deploys the real SignalEngine binary against an isolated, ephemeral copy of the
  # stack: a bundled Postgres (Bitnami subchart) and a hand-rolled, in-chart message broker
  # (NOT MessageBrokerEngine's own messagebroker-qa namespace -- true per-run isolation, no
  # cross-repo pipeline coupling), both destroyed every run. The smoke test below asserts the
  # DeploymentSubscriber actually connects to that broker, not just "no crash."
  deploy-qa:
    name: Deploy to QA & Smoke Test
    runs-on: [self-hosted, Linux, X64]
    needs: build
    if: always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && vars.KUBERNETES_ENABLED == 'true'
    # Bundled Postgres cold-start (up to a 10-minute startup-probe budget) + the
    # db-migrate hook's own waits can legitimately take longer than the old
    # placeholder deploy ever did.
    timeout-minutes: 30
    env:
      TARGET_NAMESPACE: signalengine-qa
      VALUES_FILE: values-qa.yaml
      RELEASE_NAME: signal-engine
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          path: SignalEngine

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.3'

      - name: Configure Kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Check Cluster Connectivity
        shell: bash
        run: |
          echo "Verifying Kubernetes connection..."
          # cluster-info/get nodes need cluster-wide read access the CI
          # service account deliberately doesn't have (it's scoped to just
          # the signalengine-qa namespace). Use a get on that one
          # namespace instead -- NotFound still proves the cluster is
          # reachable and the token is valid; only a real connection/auth
          # failure should fail this step.
          set +e
          OUTPUT=$(kubectl get namespace "$TARGET_NAMESPACE" --request-timeout=10s 2>&1)
          STATUS=$?
          set -e
          if [ $STATUS -eq 0 ]; then
            echo "Kubernetes connection verified (namespace exists)"
          elif echo "$OUTPUT" | grep -q "NotFound"; then
            echo "Kubernetes connection verified (namespace not yet created)"
          else
            echo "$OUTPUT" >&2
            echo "Kubernetes connection check failed" >&2
            exit 1
          fi

      - name: Resolve Message Broker Image Tag
        id: broker-tag
        run: |
          set +e
          # Reads MessageBrokerEngine's own last-validated QA image tag -- a string
          # lookup only, no runtime dependency on that pod being healthy right now.
          TAG=$(kubectl get deployment message-broker-engine -n messagebroker-qa \
            -o jsonpath='{.spec.template.spec.containers[0].image}' --request-timeout=10s 2>/dev/null \
            | awk -F: '{print $NF}')
          set -e
          if [ -z "$TAG" ]; then
            echo "[WARN] Could not resolve MessageBrokerEngine's QA image tag; falling back"
            TAG="${{ vars.MESSAGE_BROKER_ENGINE_QA_TAG }}"
          fi
          if [ -z "$TAG" ]; then
            # Matches prod's actual running broker image tag (verified live via
            # `kubectl get deployment -n messagebroker`) when neither the live
            # QA-namespace lookup nor the repo variable resolves anything. The
            # package only ever publishes `latest` + short-SHA tags -- there is
            # no "1.0.0" tag, so that prior fallback 404'd every time.
            TAG="latest"
          fi
          echo "[INFO] Resolved MessageBrokerEngine image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to QA
        run: |
          set -euo pipefail
          cd SignalEngine
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo "[QA] Deploying $IMAGE_TAG to namespace $TARGET_NAMESPACE"

          kubectl create namespace "$TARGET_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          echo "[QA] Granting CI service account (ci-system/qa-ci) admin rights in this namespace..."
          # kubectl apply is idempotent, so reapplying this every run is cheap and
          # self-healing. The namespace is now torn down at the end of every run (see
          # "Teardown QA Environment" below), which also wipes this RoleBinding, so
          # recreating it here every time is required, not just defensive -- same as
          # BacktestingEngine's equivalent step. It also still covers the first-ever
          # run, when the namespace/binding don't exist at all yet.
          cat <<RBAC | kubectl apply --validate=false -f -
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: qa-ci-admin
            namespace: $TARGET_NAMESPACE
          subjects:
          - kind: ServiceAccount
            name: qa-ci
            namespace: ci-system
          roleRef:
            kind: ClusterRole
            name: admin
            apiGroup: rbac.authorization.k8s.io
          RBAC

          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            --namespace="$TARGET_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          STATUS=$(helm list -n "$TARGET_NAMESPACE" --all -o json 2>/dev/null | jq -r '.[] | select(.name=="'"$RELEASE_NAME"'") | .status' || echo "")
          if [[ "$STATUS" == *"pending"* ]] || [ "$STATUS" = "failed" ]; then
            helm uninstall "$RELEASE_NAME" -n "$TARGET_NAMESPACE" --wait --timeout 2m 2>/dev/null || true
            sleep 5
          fi

          echo "[QA] Creating isolated Postgres secret for the bundled subchart..."
          # Credentials come from values-qa.yaml's postgresql.auth.* via yq -- single
          # source of truth, not duplicated as a second hardcoded literal here. The
          # deployment template (templates/deployment.yaml) already expects this exact
          # secret name/keys (it's how production's real Postgres is wired too).
          YQ_BIN="yq"
          if ! command -v yq >/dev/null 2>&1; then
            curl -sL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o "${RUNNER_TEMP:-/tmp}/yq"
            chmod +x "${RUNNER_TEMP:-/tmp}/yq"
            YQ_BIN="${RUNNER_TEMP:-/tmp}/yq"
          fi
          PG_USER=$("$YQ_BIN" e '.postgresql.auth.username' "./${{ env.HELM_CHART_PATH }}/$VALUES_FILE")
          PG_PASSWORD=$("$YQ_BIN" e '.postgresql.auth.password' "./${{ env.HELM_CHART_PATH }}/$VALUES_FILE")
          PG_DATABASE=$("$YQ_BIN" e '.postgresql.auth.database' "./${{ env.HELM_CHART_PATH }}/$VALUES_FILE")
          echo "::add-mask::$PG_PASSWORD"

          kubectl create secret generic signalengine-db-secret \
            --from-literal=host="${RELEASE_NAME}-postgresql" \
            --from-literal=port="5432" \
            --from-literal=username="$PG_USER" \
            --from-literal=password="$PG_PASSWORD" \
            --from-literal=database="$PG_DATABASE" \
            --namespace="$TARGET_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install "$RELEASE_NAME" ./${{ env.HELM_CHART_PATH }} \
            --namespace "$TARGET_NAMESPACE" \
            --create-namespace \
            -f ./${{ env.HELM_CHART_PATH }}/$VALUES_FILE \
            --set "image.repository=${{ env.IMAGE_NAME }}" \
            --set "image.tag=$IMAGE_TAG" \
            --set "image.pullPolicy=IfNotPresent" \
            --set "imagePullSecrets[0].name=ghcr-secret" \
            --set "messageBroker.image.tag=${{ steps.broker-tag.outputs.tag }}" \
            --timeout 15m
          echo "[OK] QA deploy complete"

      - name: Smoke Test (QA)
        run: |
          set -euo pipefail
          echo "[SMOKE] Waiting for QA pods to become ready..."
          # Target each Deployment by its own component label -- the namespace
          # now has TWO Deployments (the app and the isolated broker) sharing the
          # same app.kubernetes.io/name, so a bare "-l app.kubernetes.io/name=..."
          # selector (or no selector at all) is ambiguous for `rollout status`.
          kubectl rollout status deployment -n "$TARGET_NAMESPACE" -l app.kubernetes.io/component=signal-engine --timeout=4m
          kubectl rollout status deployment -n "$TARGET_NAMESPACE" -l app.kubernetes.io/component=message-broker --timeout=4m
          kubectl get pods -n "$TARGET_NAMESPACE" -o wide
          NOT_READY=$(kubectl get pods -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=signal-engine-helm -o jsonpath='{range .items[*]}{.status.containerStatuses[*].ready}{"\n"}{end}' | grep -c false || true)
          if [ "$NOT_READY" -gt 0 ]; then
            echo "[FAIL] One or more containers are not ready"
            kubectl describe pods -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=signal-engine-helm | tail -80
            kubectl logs -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=signal-engine-helm --tail=80 --all-containers || true
            exit 1
          fi
          LOGS=$(kubectl logs -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=signal-engine-helm --tail=200 --all-containers 2>&1 || true)
          if echo "$LOGS" | grep -qiE 'panic|FATAL'; then
            echo "[FAIL] Critical error pattern detected in QA logs"
            echo "$LOGS" | tail -50
            exit 1
          fi
          # A failed broker connection is a graceful WARN, not a panic/FATAL -- the
          # check above alone would NOT have caught it. Now that QA runs the real
          # binary against a real (if isolated) broker, require it actually connected.
          # DeploymentSubscriber::start() (crates/strategyloader) does a real TCP
          # connect + subscribe handshake as a background async task -- it reliably
          # logs a beat or two after `rollout status` reports the pod Ready (which
          # only checks the readiness probe, a bare `pgrep signal-engine`), so poll
          # for the result instead of inspecting a single immediate log snapshot.
          DEPLOYMENT_SUBSCRIBER_RESULT=""
          for i in $(seq 1 15); do
            LOGS=$(kubectl logs -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=signal-engine-helm --tail=200 --all-containers 2>&1 || true)
            if echo "$LOGS" | grep -q "DeploymentSubscriber failed to start"; then
              DEPLOYMENT_SUBSCRIBER_RESULT="failed"
              break
            fi
            if echo "$LOGS" | grep -q "DeploymentSubscriber started on"; then
              DEPLOYMENT_SUBSCRIBER_RESULT="started"
              break
            fi
            sleep 2
          done
          if [ "$DEPLOYMENT_SUBSCRIBER_RESULT" = "failed" ]; then
            echo "[FAIL] DeploymentSubscriber failed to start -- broker connection failed"
            echo "$LOGS" | tail -50
            exit 1
          fi
          if [ "$DEPLOYMENT_SUBSCRIBER_RESULT" != "started" ]; then
            echo "[FAIL] DeploymentSubscriber never reported a successful start -- no confirmed broker connection"
            echo "$LOGS" | tail -50
            exit 1
          fi
          echo "[OK] QA smoke test passed"

      - name: Setup Node.js (for qa-e2e agent)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run QA E2E Agent
        env:
          TARGET_NAMESPACE: ${{ env.TARGET_NAMESPACE }}
          IMAGE_TAG: ${{ github.sha }}
          FAIL_FAST: 'true'
          READY_TIMEOUT_SECONDS: '300'
        run: |
          set -euo pipefail
          # Truncate IMAGE_TAG to 7 chars to match Helm deploy tag
          export IMAGE_TAG="${IMAGE_TAG:0:7}"

          cd SignalEngine/qa-e2e
          # Pure-node agent, zero npm dependencies - just run it.
          node index.js

      - name: Debug Ã¢â‚¬â€ Dump QA Cluster State on Failure
        if: failure()
        run: |
          set +e
          echo "=== Pods ==="
          kubectl get pods -n "$TARGET_NAMESPACE" -o wide
          echo "=== Recent Events ==="
          kubectl get events -n "$TARGET_NAMESPACE" --sort-by='.lastTimestamp' | tail -50
          echo "=== App Pod Logs ==="
          kubectl logs -n "$TARGET_NAMESPACE" -l app.kubernetes.io/name=signal-engine-helm --tail=200 --all-containers || true

      - name: Teardown QA Environment
        if: always()
        run: |
          echo "[INFO] Tearing down QA environment..."
          helm uninstall "$RELEASE_NAME" -n "$TARGET_NAMESPACE" --wait --timeout 2m 2>/dev/null || true
          kubectl delete namespace "$TARGET_NAMESPACE" --ignore-not-found --timeout=60s 2>/dev/null || true
          echo "[OK] QA environment cleaned up"

  deploy:
    name: Deploy to Kubernetes (Prod)
    runs-on: [self-hosted, Linux, X64]
    needs: deploy-qa
    # Deploys automatically on every push to main once deploy-qa passes --
    # also still runnable manually via workflow_dispatch with
    # deploy_prod=true (e.g. to redeploy without a new commit).
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_prod == true)) && needs.deploy-qa.result == 'success' && vars.KUBERNETES_ENABLED == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          path: SignalEngine

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.3'

      - name: Configure Kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Check Kubernetes Connection
        run: |
          echo "Verifying Kubernetes connection..."
          # cluster-info/get nodes need cluster-wide read access the CI
          # service account deliberately doesn't have (it's scoped to just
          # the signalengine namespace). Use a get on that one namespace
          # instead -- it existing and being reachable is enough to prove
          # the connection and credentials are good.
          kubectl get namespace signalengine --request-timeout=10s
          echo "[OK] Kubernetes connection verified"

      - name: Read secrets from the cluster
        env:
          ENABLE_LIVE_CREDENTIALS: ${{ inputs.enable_live_credentials }}
        run: |
          set -euo pipefail
          # The database (and Massive) settings come from the secrets BacktestingEngine already uses in this
          # cluster, so SignalEngine talks to the same Postgres. There is no external vault.
          SRC_NS=backtestingengine
          get() { kubectl get secret "$1" -n "$SRC_NS" -o "jsonpath={.data.$2}" | base64 -d; }

          for PAIR in "POSTGRES_HOST:database-host" "POSTGRES_PORT:database-port" "POSTGRES_USER:database-username" "POSTGRES_PASSWORD:database-password" "POSTGRES_DB:database-name"; do
            ENV_NAME="${PAIR%%:*}"; KEY="${PAIR#*:}"
            VALUE=$(get backtesting-secrets "$KEY") || { echo "::error::could not read $KEY from backtesting-secrets"; exit 1; }
            [ -n "$VALUE" ] || { echo "::error::empty value for $KEY in backtesting-secrets"; exit 1; }
            echo "::add-mask::$VALUE"
            echo "${ENV_NAME}=${VALUE}" >> "$GITHUB_ENV"
            echo "[OK] Read $KEY"
          done

          MASSIVE=$(get backtesting-secrets MASSIVE_API_KEY 2>/dev/null || true)
          [ -z "$MASSIVE" ] || echo "::add-mask::$MASSIVE"
          echo "MASSIVE_API_KEY=${MASSIVE}" >> "$GITHUB_ENV"

          # Paper-only by default: without this key SignalEngine cannot decrypt users' exchange API keys.
          if [ "${ENABLE_LIVE_CREDENTIALS:-false}" = "true" ]; then
            KEYVAL=$(get backtestingengine-credentials-encryption key) || { echo "::error::could not read the credentials-encryption key"; exit 1; }
            echo "::add-mask::$KEYVAL"
            echo "CREDENTIALS_ENCRYPTION_KEY=${KEYVAL}" >> "$GITHUB_ENV"
            echo "[WARN] live credentials ENABLED for this deployment"
          else
            echo "CREDENTIALS_ENCRYPTION_KEY=" >> "$GITHUB_ENV"
            echo "[OK] paper-only: credentials-encryption key NOT copied"
          fi
          echo "[OK] Cluster secrets read"

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail
          echo "Deploying SignalEngine to Kubernetes..."

          cd SignalEngine

          # Create namespace if it doesn't exist
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Create image pull secret for GHCR
          echo "[INFO] Creating image pull secret..."
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Create application secrets in Kubernetes
          echo "[INFO] Creating application secrets..."

          kubectl create secret generic signalengine-db-secret \
            --from-literal=host="${POSTGRES_HOST}" \
            --from-literal=port="${POSTGRES_PORT}" \
            --from-literal=username="${POSTGRES_USER}" \
            --from-literal=password="${POSTGRES_PASSWORD}" \
            --from-literal=database="${POSTGRES_DB}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # NOTE: Per-tenant exchange API keys are NOT created here. Users add
          # their own keys via the Settings UI; SignalEngine loads them from the
          # encrypted `exchange_credentials` table on demand.

          # Master AES-256-GCM key used to decrypt those per-tenant keys.
          # MUST match the value used by BacktestingEngine.
          if [ -n "${CREDENTIALS_ENCRYPTION_KEY:-}" ]; then
            kubectl create secret generic signalengine-credentials-encryption \
              --from-literal=key="${CREDENTIALS_ENCRYPTION_KEY}" \
              --namespace=${{ env.NAMESPACE }} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "[OK] signalengine-credentials-encryption secret synced"
          else
            echo "[WARN] CREDENTIALS_ENCRYPTION_KEY not set in vault Ã¢â‚¬â€ live trading will be unable to decrypt user API keys"
          fi

          kubectl create secret generic signalengine-elastic-secret \
            --from-literal=endpoint="${ELASTIC_CLOUD_ENDPOINT:-}" \
            --from-literal=username="${ELASTIC_CLOUD_USERNAME:-}" \
            --from-literal=password="${ELASTIC_CLOUD_PASSWORD:-}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Massive API (Polygon.io market data) -- used to warm-start a
          # strategy's bar history on init (hostbuilder::fetch_warm_start_bars).
          # Optional: an empty key just skips warm-start gracefully, unlike
          # BacktestingEngine where this same vault secret is required.
          kubectl create secret generic signalengine-massive-secret \
            --from-literal=apiKey="${MASSIVE_API_KEY:-}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "[OK] Secrets synced to Kubernetes"

          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo "[INFO] Deploying with image tag: $IMAGE_TAG"

          # Check for stuck releases
          echo "[INFO] Checking Helm release status..."
          HELM_JSON=$(helm list -n ${{ env.NAMESPACE }} --all -o json 2>/dev/null || echo "[]")
          RELEASE_STATUS=$(echo "$HELM_JSON" | jq -r '.[] | select(.name=="signal-engine") | .status' 2>/dev/null || echo "")

          if [[ "$RELEASE_STATUS" == *"pending"* ]]; then
            echo "[WARN] Found stuck release in status: $RELEASE_STATUS"
            helm uninstall signal-engine -n ${{ env.NAMESPACE }} --wait --timeout 2m 2>/dev/null || true
            sleep 5
          elif [ "$RELEASE_STATUS" = "failed" ]; then
            echo "[WARN] Found failed release, uninstalling..."
            helm uninstall signal-engine -n ${{ env.NAMESPACE }} --wait --timeout 2m 2>/dev/null || true
            sleep 5
          fi

          echo "Deploying with Helm..."
          helm upgrade --install signal-engine ./${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f ./${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --set "image.repository=${{ env.IMAGE_NAME }}" \
            --set "image.tag=$IMAGE_TAG" \
            --set "image.pullPolicy=IfNotPresent" \
            --set "imagePullSecrets[0].name=ghcr-secret" \
            --timeout 5m

          echo "[OK] Helm deployment successful"

      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."

          echo "[INFO] Waiting for deployment to be ready..."
          if ! kubectl rollout status deployment -n ${{ env.NAMESPACE }} --timeout=3m 2>/dev/null; then
            echo "[WARN] Deployment may not be ready yet, checking logs..."
            kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=signal-engine-helm --tail=30 || true
          fi

          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo ""
          echo "Services:"
          kubectl get services -n ${{ env.NAMESPACE }}
          echo ""
          echo "Deployments:"
          kubectl get deployments -n ${{ env.NAMESPACE }}
          echo ""
          echo "[OK] Deployment verification complete!"

      - name: Deployment Summary
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo ""
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Release: signal-engine"
          echo "Image: ${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          echo ""
          echo "Rollback: helm rollback signal-engine -n ${{ env.NAMESPACE }}"
          echo "=========================================="
