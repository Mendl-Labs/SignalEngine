# SignalEngine CI/CD Pipeline
# Builds on ubuntu-latest, deploys to k3s on Hetzner via GHCR

name: SignalEngine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false

concurrency:
  group: signal-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/signal-engine
  NAMESPACE: signalengine
  HELM_CHART_PATH: k8s/signal-engine-helm
  DOCKER_BUILDKIT: 1

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed || steps.skip-test-result.outputs.passed }}
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          path: SignalEngine

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema

      - name: Checkout SimulationEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/SimulationEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: SimulationEngine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libpq-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SignalEngine/target/
          key: ${{ runner.os }}-cargo-signalengine-${{ hashFiles('SignalEngine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-signalengine-

      - name: Check for Skip Tests Flag
        id: check-skip
        run: |
          cd SignalEngine
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -q '\[skip-tests\]'; then
            echo "[SKIP] skip-tests flag detected"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Running full validation with tests"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast Check
        run: |
          cd SignalEngine
          cargo check --workspace
          echo "[OK] Fast check passed!"

      - name: Build Workspace
        run: |
          cd SignalEngine
          cargo build --workspace
          echo "[OK] Build passed!"

      - name: Run Tests
        if: steps.check-skip.outputs.skip != 'true' && github.event.inputs.skip_tests != 'true'
        id: test-result
        run: |
          cd SignalEngine
          # Run datahandler tests with single thread (uses global ORDERBOOKS state)
          cargo test -p datahandler -- --test-threads=1
          # Run all other tests in parallel
          if cargo test --workspace --exclude datahandler; then
            echo "[OK] Tests passed!"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "[FAIL] Tests failed!"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Skip Tests
        if: steps.check-skip.outputs.skip == 'true' || github.event.inputs.skip_tests == 'true'
        id: skip-test-result
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.tests-passed == 'true' || github.event.inputs.skip_tests == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          path: SignalEngine
          fetch-depth: 0

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine
          fetch-depth: 0

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine
          fetch-depth: 0

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema
          fetch-depth: 0

      - name: Checkout SimulationEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/SimulationEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: SimulationEngine
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Context
        run: |
          # IMPORTANT: Do NOT create a .dockerignore file at workspace root
          # SignalEngine Dockerfile copies the entire TradingPlatform workspace
          # A .dockerignore would exclude needed dependencies
          if [ -f ".dockerignore" ]; then
            echo "[WARN] Removing .dockerignore at context root"
            rm -f .dockerignore
          fi
          echo "[OK] No .dockerignore at context root"

      - name: Build & Push Image
        run: |
          set -e
          echo "Building Docker image..."

          REQUIRED_DEPS=("LoggingEngine" "MessageBrokerEngine" "databaseschema" "SimulationEngine")
          for DEP in "${REQUIRED_DEPS[@]}"; do
            if [ -d "$DEP" ]; then
              echo "[OK] Dependency found: $DEP"
            else
              echo "[ERROR] Missing: $DEP"
              exit 1
            fi
          done

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "[INFO] Building with immutable tag: $SHORT_SHA"

          docker build \
            --platform linux/amd64 \
            --tag ${{ env.IMAGE_NAME }}:$SHORT_SHA \
            --file SignalEngine/Dockerfile \
            --progress=plain \
            .

          echo "[PUSH] Pushing image..."
          docker push ${{ env.IMAGE_NAME }}:$SHORT_SHA
          docker tag ${{ env.IMAGE_NAME }}:$SHORT_SHA ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "[OK] Pushed image with tags: $SHORT_SHA, latest"

      - name: Security Scan
        continue-on-error: true
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "[SCAN] Running security scan with Trivy..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --exit-code 0 --format table ${{ env.IMAGE_NAME }}:$SHORT_SHA
          echo "[OK] Security scan complete"

      - name: Build Summary
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo ""
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Tag: $SHORT_SHA"
          echo "Pull: docker pull ${{ env.IMAGE_NAME }}:$SHORT_SHA"
          echo "=========================================="

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && vars.KUBERNETES_ENABLED == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          path: SignalEngine

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.3'

      - name: Configure Kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Check Kubernetes Connection
        run: |
          echo "Verifying Kubernetes connection..."
          kubectl cluster-info
          kubectl get nodes
          echo "[OK] Kubernetes connection verified"

      - name: Fetch Secrets from Azure Key Vault
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          set -euo pipefail
          echo "Fetching secrets from Azure Key Vault..."

          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "::error::AZURE_CREDENTIALS secret is empty or not set"
            exit 1
          fi

          CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')
          CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')
          TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$TENANT_ID" ]; then
            echo "::error::Invalid Azure credentials format"
            exit 1
          fi
          echo "[OK] Azure credentials parsed successfully"

          echo "[INFO] Authenticating with Azure..."
          az login --service-principal \
            --username "$CLIENT_ID" \
            --password "$CLIENT_SECRET" \
            --tenant "$TENANT_ID" \
            --output none
          echo "[OK] Successfully authenticated with Azure"

          # Required secrets
          REQUIRED_SECRETS=(
            "POSTGRES-HOST" "POSTGRES-PORT" "POSTGRES-USER" "POSTGRES-PASSWORD" "POSTGRES-DB"
          )

          # Optional secrets
          OPTIONAL_SECRETS=(
            "ELASTIC-CLOUD-ENDPOINT" "ELASTIC-CLOUD-USERNAME" "ELASTIC-CLOUD-PASSWORD"
            "kraken-api-key" "kraken-secret-key"
          )

          echo "[INFO] Fetching required secrets..."
          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            ENV_NAME="${SECRET_NAME//-/_}"
            VALUE=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv 2>&1) || {
              echo "::error::[FAIL] Failed to fetch required secret $SECRET_NAME"
              exit 1
            }
            if [ -z "$VALUE" ]; then
              echo "::error::[FAIL] Empty value for required secret $SECRET_NAME"
              exit 1
            fi
            echo "::add-mask::$VALUE"
            echo "${ENV_NAME}=${VALUE}" >> "$GITHUB_ENV"
            echo "[OK] Fetched $SECRET_NAME"
          done

          echo "[INFO] Fetching optional secrets..."
          for SECRET_NAME in "${OPTIONAL_SECRETS[@]}"; do
            ENV_NAME="${SECRET_NAME//-/_}"
            VALUE=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv 2>/dev/null) || VALUE=""
            if [ -n "$VALUE" ]; then
              echo "::add-mask::$VALUE"
              echo "${ENV_NAME}=${VALUE}" >> "$GITHUB_ENV"
              echo "[OK] Fetched $SECRET_NAME"
            else
              echo "${ENV_NAME}=" >> "$GITHUB_ENV"
              echo "[SKIP] $SECRET_NAME not found in Key Vault (optional)"
            fi
          done

          az logout 2>/dev/null || true
          echo "[OK] All secrets fetched successfully"

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail
          echo "Deploying SignalEngine to Kubernetes..."

          cd SignalEngine

          # Create namespace if it doesn't exist
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Create image pull secret for GHCR
          echo "[INFO] Creating image pull secret..."
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Create application secrets in Kubernetes
          echo "[INFO] Creating application secrets..."

          kubectl create secret generic signalengine-db-secret \
            --from-literal=host="${POSTGRES_HOST}" \
            --from-literal=port="${POSTGRES_PORT}" \
            --from-literal=username="${POSTGRES_USER}" \
            --from-literal=password="${POSTGRES_PASSWORD}" \
            --from-literal=database="${POSTGRES_DB}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic signalengine-kraken-secret \
            --from-literal=api-key="${kraken_api_key:-}" \
            --from-literal=secret-key="${kraken_secret_key:-}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic signalengine-elastic-secret \
            --from-literal=endpoint="${ELASTIC_CLOUD_ENDPOINT:-}" \
            --from-literal=username="${ELASTIC_CLOUD_USERNAME:-}" \
            --from-literal=password="${ELASTIC_CLOUD_PASSWORD:-}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "[OK] Secrets synced to Kubernetes"

          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo "[INFO] Deploying with image tag: $IMAGE_TAG"

          # Check for stuck releases
          echo "[INFO] Checking Helm release status..."
          HELM_JSON=$(helm list -n ${{ env.NAMESPACE }} --all -o json 2>/dev/null || echo "[]")
          RELEASE_STATUS=$(echo "$HELM_JSON" | jq -r '.[] | select(.name=="signal-engine") | .status' 2>/dev/null || echo "")

          if [[ "$RELEASE_STATUS" == *"pending"* ]]; then
            echo "[WARN] Found stuck release in status: $RELEASE_STATUS"
            helm uninstall signal-engine -n ${{ env.NAMESPACE }} --wait --timeout 2m 2>/dev/null || true
            sleep 5
          elif [ "$RELEASE_STATUS" = "failed" ]; then
            echo "[WARN] Found failed release, uninstalling..."
            helm uninstall signal-engine -n ${{ env.NAMESPACE }} --wait --timeout 2m 2>/dev/null || true
            sleep 5
          fi

          echo "Deploying with Helm..."
          helm upgrade --install signal-engine ./${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f ./${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --set "image.repository=${{ env.IMAGE_NAME }}" \
            --set "image.tag=$IMAGE_TAG" \
            --set "image.pullPolicy=IfNotPresent" \
            --set "imagePullSecrets[0].name=ghcr-secret" \
            --timeout 5m

          echo "[OK] Helm deployment successful"

      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."

          echo "[INFO] Waiting for deployment to be ready..."
          if ! kubectl rollout status deployment -n ${{ env.NAMESPACE }} --timeout=3m 2>/dev/null; then
            echo "[WARN] Deployment may not be ready yet, checking logs..."
            kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=signal-engine-helm --tail=30 || true
          fi

          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo ""
          echo "Services:"
          kubectl get services -n ${{ env.NAMESPACE }}
          echo ""
          echo "Deployments:"
          kubectl get deployments -n ${{ env.NAMESPACE }}
          echo ""
          echo "[OK] Deployment verification complete!"

      - name: Deployment Summary
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo ""
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Release: signal-engine"
          echo "Image: ${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          echo ""
          echo "Rollback: helm rollback signal-engine -n ${{ env.NAMESPACE }}"
          echo "=========================================="
